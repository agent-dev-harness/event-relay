name: Release tag

# Tags main as v<package.json version> once that version has no tag yet, so a
# release is a reviewed PR that bumps the version rather than a hand-pushed tag.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find the version's tag
        id: version
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$tag already exists; nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: '24'
          cache: 'npm'
      - name: Run the merge gate on the commit being tagged
        if: steps.version.outputs.exists == 'false'
        run: ci/check.sh
      - name: Tag
        if: steps.version.outputs.exists == 'false'
        run: |
          git tag "${{ steps.version.outputs.tag }}" "$GITHUB_SHA"
          git push origin "${{ steps.version.outputs.tag }}"
